name              = "skillsguard-api"
main              = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# ── Tunable config vars (change here, redeploy — no code edit needed) ─────────
[vars]
# Maximum request body in bytes (default 512 KB)
MAX_BODY_BYTES = 524288

# Sliding-window rate limit: max requests per IP per window
RATE_LIMIT_MAX = 60

# Window size in milliseconds (default 60 s)
RATE_LIMIT_WINDOW_MS = 60000

# Comma-separated allowed CORS origins.
# Use "*" for fully public (any origin).
# Use e.g. "https://skillsguard.dev,https://app.skillsguard.dev" to restrict.
CORS_ALLOWED_ORIGINS = "*"

# ── Durable Object for global rate limiting ────────────────────────────────────
[[durable_objects.bindings]]
name       = "RATE_LIMITER"
class_name = "RateLimiterDO"

[[migrations]]
tag              = "v1"
new_sqlite_classes = ["RateLimiterDO"]
